	$('#submit').on('click', function(e){

      // console.log(new FormData($('form')[0]))
      // $.ajax({

      //   type: 'POST',

      //   console.log("An error occurred, the files couldn't be sent!");

      $.ajax({
        url:'/widget-upload.php',
        type: 'POST',
        contentType: false,
        data: new FormData($('#video-upload')[0]),  // The form with the file inputs.
        processData: false,  // Using FormData, don't process data.
        xhr: function() {
            var myXhr = $.ajaxSettings.xhr();
            if (myXhr.upload) {
                // For handling the progress of the upload
                myXhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        $('progress').attr({
                            value: e.loaded,
                            max: e.total,
                        });
                    }
                } , false);
            }
            return myXhr;
        },
      }).done(function(data){
        console.log(data);
        $('body').append('<video controls autoplay><source src="'+data+'" type="video/mp4"></video>');
      });
  });
});
</script>
